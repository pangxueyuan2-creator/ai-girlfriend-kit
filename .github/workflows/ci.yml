name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest ruff

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Run tests
        run: pytest -q

      - name: CLI smoke
        run: |
          aigf version
          aigf --help
          aigf init
          aigf persona list
          aigf persona set teasing-sister
          aigf memory add "CI smoke memory" --category preference --importance high
          aigf memory list
          aigf memory compact
          aigf context build | head -n 5
          aigf export prompt | head -n 3
          aigf export sillytavern /tmp/st-card.json
          aigf export openwebui /tmp/ow.json
          aigf doctor
          test -f /tmp/st-card.json
          test -f /tmp/ow.json
