[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aigf"
version = "0.1.0"
description = "Local-first toolkit for managing AI companion personalities and long-term memory."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "pangxueyuan2-creator"}]
keywords = ["ai-companion", "memory", "persona", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "typer>=0.12,<1",
]

[project.scripts]
aigf = "aigf.cli:app"

[project.urls]
Homepage = "https://github.com/pangxueyuan2-creator/ai-girlfriend-kit"
Repository = "https://github.com/pangxueyuan2-creator/ai-girlfriend-kit"
Issues = "https://github.com/pangxueyuan2-creator/ai-girlfriend-kit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aigf = ["py.typed", "personalities/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "B904"]
